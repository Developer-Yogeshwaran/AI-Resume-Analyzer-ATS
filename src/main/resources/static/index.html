<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Resume Analyzer</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="container">

    <header>
        <h1><i class="fa fa-robot"></i> AI Resume Analyzer</h1>
        <p>Upload your resume and get insights on skills, experience, and fit</p>
    </header>

    <section class="upload-card">
        <div class="file-upload">
            <i class="fa fa-file-upload fa-2x"></i>
            <input type="file" id="resumeFile" />
        </div>
        <button class="primary-btn" onclick="analyzeResume()">Analyze Resume</button>
    </section>

    <section class="result-card">
        <h2><i class="fa fa-chart-line"></i> Analysis Result</h2>
        <div id="result" class="result-box">
            <p class="placeholder">Your resume analysis will appear here...</p>
        </div>
    </section>

    <footer>
        <a class="link-btn" href="ats.html"><i class="fa fa-arrow-right"></i> Check ATS Score</a>
    </footer>

</div>
<script src="js/app.js"></script>
</body>
</html>
